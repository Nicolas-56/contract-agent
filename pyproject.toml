[project]
name = "contract-agent"
version = "0.1.0"
description = "A minimal MCP server and client for synthetic contracts."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
anthropic = ["langchain-anthropic>=1.0,<2"]
ollama = ["langchain-ollama>=1.0,<2"]
